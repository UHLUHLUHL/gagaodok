<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 전부 앱 번들 안의 파일입니다. 네트워크를 타지 않으므로 오프라인에서도 수식이 그려집니다. -->
    <link rel="stylesheet" href="katex/katex.min.css">
    <script src="katex/katex.min.js"></script>
    <script src="katex/auto-render.min.js"></script>
    <script src="markdown-it.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* Pretendard는 시스템에 설치되어 있어 웹폰트를 받지 않아도 됩니다. */
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            font-size: 13.5px;
            line-height: 1.50;
            color: #1A1A1A;
            background-color: transparent;
            word-break: break-word;
            overflow: hidden;
            user-select: text !important;
            -webkit-user-select: text !important;
            letter-spacing: -0.2px;
        }
        #content {
            display: inline-block;
            width: 100%;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        p { margin-bottom: 5px; }
        p:last-child { margin-bottom: 0; }

        /* 수식 폰트 크기 스케일업 & 두께 보정 */
        .katex {
            font-size: 1.05em;
            -webkit-text-stroke: 0.18px currentColor !important;
            letter-spacing: 0.2px;
            /* 인라인 수식은 문장 안의 안전한 glue 지점에서 줄을 바꿀 수 있어야 합니다. */
            white-space: normal;
        }
        .katex-display {
            margin: 7px 0 !important;
            /* 수식은 JS에서 의미 단위로 나누고 마지막에는 폭에 맞춥니다. 가로 스크롤은 만들지 않습니다. */
            overflow-x: hidden;
            overflow-y: hidden;
            padding: 4px 2px !important;
            white-space: normal;
            max-width: 100%;
        }
        .katex-display > .katex {
            font-size: 1.22em !important;
            white-space: normal !important;
        }

        .katex .frac-line { border-bottom-width: 1.5px !important; }
        .katex .sqrt-line { border-top-width: 1.5px !important; }
        .katex .mord, .katex .mbin, .katex .mrel, .katex .mop {
            -webkit-text-stroke: 0.18px currentColor !important;
        }

        pre {
            background-color: rgba(0, 0, 0, 0.06);
            border-radius: 6px;
            padding: 6px 8px;
            font-family: "Pretendard Variable", Menlo, Monaco, monospace;
            font-size: 12px;
            overflow-x: auto;
            margin: 4px 0;
        }
        code {
            font-family: Menlo, Monaco, "Courier New", monospace;
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 1px 3px;
            border-radius: 3px;
        }
        pre code { background-color: transparent; padding: 0; }
        ul, ol { margin-left: 16px; margin-bottom: 4px; }
        li { margin-bottom: 2px; }
        blockquote {
            border-left: 3px solid rgba(0, 0, 0, 0.2);
            padding-left: 6px;
            margin: 4px 0;
            color: rgba(0, 0, 0, 0.75);
        }
        hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.14);
            margin: 9px 0;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            margin: 6px 0;
            font-size: 12.5px;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 7px;
            overflow: hidden;
        }
        th, td {
            border-right: 1px solid rgba(0, 0, 0, 0.10);
            border-bottom: 1px solid rgba(0, 0, 0, 0.10);
            padding: 6px 8px;
            text-align: center;
            vertical-align: middle;
        }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        th {
            background-color: rgba(0, 0, 0, 0.05);
            font-weight: 600;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.85);
        }
        td { background-color: rgba(255, 255, 255, 0.45); }

        /* 다크 모드. 앱 전체 외형을 바꾸면 웹뷰도 이 규칙을 따릅니다.
           수식은 KaTeX가 그린 노드라 색을 물려받게 두어야 합니다. */
        @media (prefers-color-scheme: dark) {
            body { color: #ECECEC; }
            .katex, .katex * { color: inherit; }
            code, pre { background-color: rgba(255, 255, 255, 0.10); }
            blockquote { color: rgba(255, 255, 255, 0.72); }
            table { border-color: rgba(255, 255, 255, 0.18); }
            th, td { border-color: rgba(255, 255, 255, 0.12); }
            th { background-color: rgba(255, 255, 255, 0.10); color: rgba(255, 255, 255, 0.92); }
            td { background-color: rgba(255, 255, 255, 0.04); }
            hr { border-color: rgba(255, 255, 255, 0.16); }
            a { color: #6FB3FF; }
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        const container = document.getElementById('content');
        const md = window.markdownit({ html: false, breaks: true, linkify: true });

        // markdown-it의 줄바꿈 처리가 $$ ... $$ 내부에 <br>를 넣으면
        // KaTeX가 시작/끝 구분자를 한 블록으로 찾지 못합니다. 먼저 블록 수식을
        // 안전한 토큰으로 치환하고 Markdown 렌더링 뒤 KaTeX HTML로 복원합니다.
        function protectDisplayMath(source, left, right, sink) {
            let output = '';
            let cursor = 0;
            while (cursor < source.length) {
                const start = source.indexOf(left, cursor);
                if (start < 0) { output += source.slice(cursor); break; }
                const end = source.indexOf(right, start + left.length);
                if (end < 0) { output += source.slice(cursor); break; }
                const token = `KATEXDISPLAYBLOCKTOKEN${sink.length}END`;
                sink.push(source.slice(start + left.length, end));
                output += source.slice(cursor, start) + String.fromCharCode(10, 10) + token + String.fromCharCode(10, 10);
                cursor = end + right.length;
            }
            return output;
        }

        // CommonMark는 닫는 **가 구두점 뒤에 오고 곧바로 글자가 이어지면 강조를 닫지 않습니다.
        // 한국어는 "**공식(확장)**을"처럼 괄호·마침표 뒤에 조사가 바로 붙어 이 규칙에 자주 걸립니다.
        // 강조 안쪽 끝에 폭 없는 공백을 넣어 구두점 판정만 피하고 보이는 글자는 바꾸지 않습니다.
        function fixTightBoldDelimiters(source) {
            if (source.indexOf('```') >= 0) return source; // 코드 블록은 건드리지 않습니다
            return source.replace(/\*\*(\S(?:[\s\S]*?\S)?)\*\*/g, (match, inner, offset, whole) => {
                const following = whole[offset + match.length];
                const lastChar = inner[inner.length - 1];
                const endsWithPunctuation = /[\p{P}\p{S}]/u.test(lastChar);
                const followedByLetter = following !== undefined && /[\p{L}\p{N}]/u.test(following);
                return (endsWithPunctuation && followedByLetter)
                    ? '**' + inner + String.fromCharCode(0x200B) + '**'
                    : match;
            });
        }

        // 세계 최고 수준(World-Class)의 지능형 수식 포매터
        // 선형대수학, 미적분학, 공업수학, 미분기하학, 복소해석학, 확률통계의 모든 수식을
        // 교과서 칠판 필기 수준의 \begin{aligned} 구조로 최적 정렬합니다.
        function autoAlignLongMath(formula) {
            const trimmed = formula.trim();
            
            // 이미 TeX 환경이거나 수동 줄바꿈이 있으면 100% 무결점 보존
            if (trimmed.includes('\\\\') || trimmed.includes('\\begin{') || trimmed.includes('\\cases') || trimmed.includes('\\matrix') || trimmed.includes('\\array') || trimmed.includes('\\aligned') || trimmed.includes('\\gather')) {
                return trimmed;
            }

            function isEscaped(str, index) {
                let count = 0;
                let i = index - 1;
                while (i >= 0 && str[i] === '\\') {
                    count++;
                    i--;
                }
                return count % 2 !== 0;
            }

            function cleanStr(s) {
                return s.replace(/^(\\(?:quad|qquad|,|;|!)|\s)+/g, '').replace(/(\\(?:quad|qquad|,|;|!)|\s)+$/g, '').trim();
            }

            function splitTrailingAnnotation(line) {
                const value = line.trim();
                if (!value.endsWith(')') || value.length <= 32) return null;
                let depth = 0;
                let opening = -1;
                for (let i = value.length - 1; i >= 0; i--) {
                    if (value[i] === ')') depth++;
                    else if (value[i] === '(') {
                        depth--;
                        if (depth === 0) { opening = i; break; }
                    }
                }
                if (opening <= 0) return null;
                const annot = value.slice(opening).trim();
                const expr = value.slice(0, opening).replace(/(?:\\quad|\\qquad|\s)+$/g, '').trim();
                if (expr && annot.includes('\\text{')) {
                    return { expr: expr, annot: annot };
                }
                return null;
            }

            // 긴 본식 뒤의 "(단, ...)" 조건은 브라우저의 임의 글루 지점에서 한 글자만
            // 떨어뜨리지 않고, 조건 전체를 의도적인 둘째 행으로 옮깁니다.
            const trailingAnnotation = splitTrailingAnnotation(trimmed);
            if (trailingAnnotation && trimmed.length > 42) {
                return '\\begin{gathered}\n' + cleanStr(trailingAnnotation.expr) +
                    ' \\\\\n' + cleanStr(trailingAnnotation.annot) + '\n\\end{gathered}';
            }

            // 1급 관계 연산자 목록 (긴 문자열 우선 매칭)
            const relOps = [
                '\\stackrel{\\text{def}}{=}', '\\coloneqq', ':=',
                '\\approx', '\\equiv', '\\simeq', '\\cong', '\\propto', '\\asymp', '\\sim',
                '\\leq', '\\geq', '\\le', '\\ge', '\\ll', '\\gg', '\\neq', '\\ne',
                '='
            ];

            function matchRelOp(str, idx) {
                for (const op of relOps) {
                    if (str.startsWith(op, idx)) {
                        if (op.startsWith('\\') && /[a-zA-Z]/.test(op[op.length - 1])) {
                            const nextChar = str[idx + op.length];
                            if (nextChar && /[a-zA-Z]/.test(nextChar)) continue;
                        }
                        return { op: op, len: op.length };
                    }
                }
                return null;
            }

            // 1. 최상위 레벨 분할 (쉼표, 세미콜론, \\implies, \\iff 등 논리 연결자)
            let parts = [];
            let separators = [];
            let current = '';
            let depth = 0;

            for (let i = 0; i < trimmed.length; i++) {
                const c = trimmed[i];

                if (trimmed.startsWith('\\text{', i) || trimmed.startsWith('\\mathrm{', i) || trimmed.startsWith('\\mathbf{', i) || trimmed.startsWith('\\operatorname{', i)) {
                    const tagLen = trimmed.indexOf('{', i) - i + 1;
                    current += trimmed.slice(i, i + tagLen);
                    i += (tagLen - 1);
                    depth++;
                    continue;
                }

                if (c === '{' || c === '(' || c === '[') depth++;
                else if (c === '}' || c === ')' || c === ']') depth = Math.max(0, depth - 1);

                if (depth === 0 && !isEscaped(trimmed, i)) {
                    if (c === ',' || c === ';') {
                        if (current.trim()) parts.push(current.trim());
                        separators.push(c);
                        current = '';
                        continue;
                    } else if (trimmed.startsWith('\\implies', i) && !/[a-zA-Z]/.test(trimmed[i + 8] || '')) {
                        if (current.trim()) parts.push(current.trim());
                        separators.push('\\implies');
                        current = '';
                        i += 7;
                        continue;
                    } else if (trimmed.startsWith('\\iff', i) && !/[a-zA-Z]/.test(trimmed[i + 4] || '')) {
                        if (current.trim()) parts.push(current.trim());
                        separators.push('\\iff');
                        current = '';
                        i += 3;
                        continue;
                    }
                }
                current += c;
            }
            if (current.trim()) parts.push(current.trim());

            // 단일 부속 식(part) 내부에서 연산자 분할
            function splitOperators(partStr) {
                let opList = [];
                let cur = '';
                let d = 0;
                for (let i = 0; i < partStr.length; i++) {
                    const ch = partStr[i];
                    if (ch === '{' || ch === '(' || ch === '[') d++;
                    else if (ch === '}' || ch === ')' || ch === ']') d = Math.max(0, d - 1);

                    if (d === 0 && !isEscaped(partStr, i)) {
                        const matched = matchRelOp(partStr, i);
                        if (matched) {
                            opList.push({ expr: cur.trim(), op: matched.op });
                            cur = '';
                            i += (matched.len - 1);
                            continue;
                        }
                    }
                    cur += ch;
                }
                if (cur.trim()) opList.push({ expr: cur.trim(), op: '' });
                return opList;
            }

            // 괄호·분수·행렬 안은 건드리지 않고 최상위 +, -, \pm, \mp 항만 나눕니다.
            // 미분의 곱법칙처럼 등호는 하나지만 우변이 긴 합인 식을 여러 줄로 만드는 핵심입니다.
            function splitAdditiveTerms(expression) {
                const terms = [];
                let current = '';
                let pendingSign = '';
                let d = 0;

                function flush() {
                    const value = current.trim();
                    if (value) terms.push({ sign: pendingSign, expr: value });
                    current = '';
                    pendingSign = '';
                }

                for (let i = 0; i < expression.length; i++) {
                    const ch = expression[i];
                    if (ch === '{' || ch === '(' || ch === '[') d++;
                    else if (ch === '}' || ch === ')' || ch === ']') d = Math.max(0, d - 1);

                    if (d === 0 && !isEscaped(expression, i)) {
                        let sign = '';
                        let length = 1;
                        if (expression.startsWith('\\pm', i) && !/[a-zA-Z]/.test(expression[i + 3] || '')) {
                            sign = '\\pm'; length = 3;
                        } else if (expression.startsWith('\\mp', i) && !/[a-zA-Z]/.test(expression[i + 3] || '')) {
                            sign = '\\mp'; length = 3;
                        } else if ((ch === '+' || ch === '-') && current.trim()) {
                            sign = ch;
                        }

                        if (sign && current.trim()) {
                            flush();
                            pendingSign = sign;
                            i += length - 1;
                            continue;
                        }
                    }
                    current += ch;
                }
                flush();
                return terms;
            }

            function relationLines(ops, leader, wholeLength) {
                let output = '';
                for (let i = 0; i < ops.length - 1; i++) {
                    const left = cleanStr(ops[i].expr);
                    const right = cleanStr(ops[i + 1].expr);
                    const terms = splitAdditiveTerms(right);
                    const wrapTerms = terms.length >= 2 && (right.length > 30 || wholeLength > 46);
                    const firstRight = wrapTerms ? terms[0].expr : right;

                    if (i === 0) {
                        output += leader + left + ' &' + ops[i].op + ' ' + firstRight;
                    } else {
                        output += ' \\\\\n&' + ops[i].op + ' ' + firstRight;
                    }

                    if (wrapTerms) {
                        for (let termIndex = 1; termIndex < terms.length; termIndex++) {
                            const term = terms[termIndex];
                            output += ' \\\\\n&\\quad ' + term.sign + ' ' + term.expr;
                        }
                    }
                }
                return output;
            }

            // A. 쉼표(,)나 논리 기호(\implies, \iff)로 나뉜 복수 식/방정식 시스템
            if (parts.length >= 2) {
                const parsedParts = parts.map(p => ({ raw: p, ops: splitOperators(p) }));
                const hasLogicalSep = separators.some(s => s === '\\implies' || s === '\\iff');
                const totalOpsCount = parsedParts.reduce((acc, p) => acc + (p.ops.length - 1), 0);

                if (totalOpsCount >= 2 || hasLogicalSep || trimmed.length > 42) {
                    let aligned = '\\begin{aligned}\n';
                    
                    if (hasLogicalSep) {
                        for (let idx = 0; idx < parsedParts.length; idx++) {
                            const pp = parsedParts[idx];
                            const prevSep = idx > 0 ? separators[idx - 1] : '';
                            const isLogicLeader = prevSep === '\\implies' || prevSep === '\\iff';
                            const sepPrefix = isLogicLeader ? prevSep + ' ' : '';

                            const lineContent = cleanStr(pp.raw);
                            const splitAnnot = splitTrailingAnnotation(lineContent);
                            if (pp.ops.length >= 2) {
                                aligned += relationLines(pp.ops, sepPrefix, trimmed.length);
                            } else if (splitAnnot) {
                                aligned += '&' + sepPrefix + cleanStr(splitAnnot.expr) + ' \\\\\n&\\quad ' + cleanStr(splitAnnot.annot);
                            } else {
                                aligned += '&' + sepPrefix + lineContent;
                            }

                            if (idx < parsedParts.length - 1) {
                                aligned += ' \\\\\n';
                            } else {
                                aligned += '\n';
                            }
                        }
                    } else {
                        for (let idx = 0; idx < parsedParts.length; idx++) {
                            const pp = parsedParts[idx];
                            const sep = separators[idx] || '';
                            const sepSuffix = (idx < parsedParts.length - 1 && (sep === ',' || sep === ';')) ? sep + ' \\\\\n' : (idx < parsedParts.length - 1 ? ' \\\\\n' : '\n');

                            if (pp.ops.length >= 2) {
                                aligned += relationLines(pp.ops, '', trimmed.length);
                                aligned += sepSuffix;
                            } else {
                                aligned += cleanStr(pp.raw) + sepSuffix;
                            }
                        }
                    }

                    aligned += '\\end{aligned}';
                    return aligned;
                }
            }

            // B. 단일 체인 전개식 (A = B = C = D = ...)
            const chainOps = splitOperators(trimmed);
            
            // -1 \leq x \leq 1 같은 짧은 유계 부등식(샌드위치 범위)은 세로로 쪼개지 않고 한 줄로 보존
            const isBoundedIneq = chainOps.length === 3 && trimmed.length <= 38 && 
                ['\\leq', '\\geq', '\\le', '\\ge'].includes(chainOps[0].op) && 
                ['\\leq', '\\geq', '\\le', '\\ge'].includes(chainOps[1].op);

            if (!isBoundedIneq && (chainOps.length >= 3 || (chainOps.length >= 2 && trimmed.length > 48))) {
                let aligned = '\\begin{aligned}\n';
                aligned += relationLines(chainOps, '', trimmed.length);
                aligned += '\n\\end{aligned}';
                return aligned;
            }

            // 관계 연산자가 없는 긴 합도 항 단위로 줄을 바꿉니다.
            const standaloneTerms = splitAdditiveTerms(trimmed);
            if (standaloneTerms.length >= 2 && trimmed.length > 42) {
                let aligned = '\\begin{aligned}\n&' + standaloneTerms[0].expr;
                for (let i = 1; i < standaloneTerms.length; i++) {
                    aligned += ' \\\\\n&\\quad ' + standaloneTerms[i].sign + ' ' + standaloneTerms[i].expr;
                }
                aligned += '\n\\end{aligned}';
                return aligned;
            }

            return trimmed;
        }

        // 의미 단위로도 나눌 수 없는 긴 원자식은 마지막 안전장치로 폭에 맞춥니다.
        // 가로 스크롤이나 오른쪽 잘림은 어떤 경우에도 남기지 않습니다.
        function fitDisplayMath() {
            const blocks = container.querySelectorAll('.katex-display');
            for (const block of blocks) {
                const formula = block.querySelector('.katex');
                if (!formula) continue;
                formula.style.removeProperty('font-size');
                formula.style.removeProperty('transform');
                formula.style.removeProperty('transform-origin');
                formula.style.removeProperty('display');
                const available = block.clientWidth;
                if (available <= 0) continue;
                for (let pass = 0; pass < 3; pass++) {
                    const needed = formula.scrollWidth;
                    if (needed <= available) break;
                    const current = parseFloat(getComputedStyle(formula).fontSize);
                    const target = Math.max(current * (available / needed) * 0.98, 9.5);
                    formula.style.setProperty('font-size', target + 'px', 'important');
                }
                if (formula.scrollWidth > block.clientWidth + 1) {
                    const scale = Math.max((block.clientWidth / formula.scrollWidth) * 0.98, 0.1);
                    formula.style.setProperty('display', 'inline-block');
                    formula.style.setProperty('transform', `scale(${scale})`);
                    // KaTeX 원래 박스의 왼쪽에서 축소해야 오른쪽으로 밀려 다시 잘리지 않습니다.
                    formula.style.setProperty('transform-origin', 'left top');
                }
            }
        }

        function sendHeight() {
            const height = Math.ceil(container.scrollHeight);
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.heightHandler) {
                window.webkit.messageHandlers.heightHandler.postMessage(height);
            }
        }

        function refresh() {
            fitDisplayMath();
            sendHeight();
        }

        // 검색어 하이라이트
        window.highlightSearch = function (needle, isCurrent) {
            document.querySelectorAll('mark.kk-find').forEach(function (m) {
                m.replaceWith(document.createTextNode(m.textContent));
            });
            document.body.normalize();
            if (!needle) return;

            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
                acceptNode: function (node) {
                    if (node.parentElement.closest('.katex, .katex-display, script, style')) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return node.nodeValue.toLowerCase().indexOf(needle.toLowerCase()) >= 0
                        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                }
            });
            var targets = [];
            while (walker.nextNode()) targets.push(walker.currentNode);

            var color = isCurrent ? '#59a8ff' : '#a8d9ff';
            targets.forEach(function (node) {
                var text = node.nodeValue;
                var lower = text.toLowerCase();
                var find = needle.toLowerCase();
                var frag = document.createDocumentFragment();
                var at = 0, hit;
                while ((hit = lower.indexOf(find, at)) >= 0) {
                    if (hit > at) frag.appendChild(document.createTextNode(text.slice(at, hit)));
                    var mark = document.createElement('mark');
                    mark.className = 'kk-find';
                    mark.style.background = color;
                    mark.style.color = 'inherit';
                    mark.style.borderRadius = '2px';
                    mark.textContent = text.slice(hit, hit + needle.length);
                    frag.appendChild(mark);
                    at = hit + needle.length;
                }
                if (at < text.length) frag.appendChild(document.createTextNode(text.slice(at)));
                node.parentNode.replaceChild(frag, node);
            });
        };

        // 번호 매기기 목록(1., 2.)이나 글머리 기호(-, *)에 붙은 긴 인라인 수식이나 등호 2개 이상 전개식을
        // 독립 디스플레이 수식($$ ... $$)으로 승격시켜 autoAlignLongMath의 세로 정렬 혜택을 받도록 합니다.
        function promoteLongInlineMath(source) {
            return source.replace(/^(\s*(?:\d+\.|\-|\*)\s*)\$([^$\n]+)\$(\s*)$/gm, (match, prefix, math, suffix) => {
                const trimmedMath = math.trim();
                if (trimmedMath.includes('=') && (trimmedMath.split('=').length >= 3 || trimmedMath.length > 28)) {
                    return `${prefix}\n$$\n${trimmedMath}\n$$\n`;
                }
                return match;
            });
        }

        window.renderContent = function (rawMarkdown) {
            const displayMathBlocks = [];
            let source = promoteLongInlineMath(rawMarkdown);
            source = protectDisplayMath(source, '$$', '$$', displayMathBlocks);
            source = protectDisplayMath(source, '\\[', '\\]', displayMathBlocks);
            source = fixTightBoldDelimiters(source);

            let renderedHtml = md.render(source);
            displayMathBlocks.forEach((formula, index) => {
                const token = `KATEXDISPLAYBLOCKTOKEN${index}END`;
                const formatted = autoAlignLongMath(formula);
                const mathHtml = katex.renderToString(formatted.trim(), {
                    displayMode: true, throwOnError: false, strict: false
                });
                renderedHtml = renderedHtml.split(token).join(mathHtml);
            });
            container.innerHTML = renderedHtml;

            renderMathInElement(container, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false,
                strict: false
            });

            refresh();
            setTimeout(refresh, 40);
            return Math.ceil(container.scrollHeight);
        };

        let lastObservedWidth = 0;
        const resizeObserver = new ResizeObserver(() => {
            const width = container.clientWidth;
            if (Math.abs(width - lastObservedWidth) > 0.5) {
                lastObservedWidth = width;
                fitDisplayMath();
            }
            sendHeight();
        });
        resizeObserver.observe(container);

        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.readyHandler) {
            window.webkit.messageHandlers.readyHandler.postMessage(1);
        }
    </script>
</body>
