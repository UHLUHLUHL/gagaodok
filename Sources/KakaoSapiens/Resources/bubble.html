<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 전부 앱 번들 안의 파일입니다. 네트워크를 타지 않으므로 오프라인에서도 수식이 그려집니다. -->
    <link rel="stylesheet" href="katex/katex.min.css">
    <script src="katex/katex.min.js"></script>
    <script src="katex/auto-render.min.js"></script>
    <script src="markdown-it.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            /* Pretendard는 시스템에 설치되어 있어 웹폰트를 받지 않아도 됩니다. */
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            font-size: 13.5px;
            line-height: 1.50;
            color: #1A1A1A;
            background-color: transparent;
            word-break: break-word;
            overflow: hidden;
            user-select: text !important;
            -webkit-user-select: text !important;
            letter-spacing: -0.2px;
        }
        #content {
            display: inline-block;
            width: 100%;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        p { margin-bottom: 5px; }
        p:last-child { margin-bottom: 0; }

        /* 수식 폰트 크기 스케일업 & 두께 보정 */
        .katex {
            font-size: 1.18em !important;
            line-height: 1.25 !important;
            text-rendering: optimizeLegibility !important;
            -webkit-text-stroke: 0.18px currentColor !important;
            letter-spacing: 0.2px;
        }
        .katex-display {
            margin: 7px 0 !important;
            /* 자동 축소로도 안 들어가는 아주 긴 수식만 마지막 수단으로 가로 스크롤합니다. */
            overflow-x: auto;
            overflow-y: hidden;
            padding: 4px 2px !important;
        }
        .katex-display > .katex { font-size: 1.22em !important; }

        /* 가로로 넘치는 수식이 남아 있을 때 잘렸다는 걸 알 수 있게 오른쪽 끝을 흐리게 처리합니다. */
        .katex-display.is-overflowing {
            -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent 100%);
            mask-image: linear-gradient(to right, #000 calc(100% - 22px), transparent 100%);
        }

        .katex .frac-line { border-bottom-width: 1.5px !important; }
        .katex .sqrt-line { border-top-width: 1.5px !important; }
        .katex .mord, .katex .mbin, .katex .mrel, .katex .mop {
            -webkit-text-stroke: 0.18px currentColor !important;
        }

        pre {
            background-color: rgba(0, 0, 0, 0.06);
            border-radius: 6px;
            padding: 6px 8px;
            font-family: "Pretendard Variable", Menlo, Monaco, monospace;
            font-size: 12px;
            overflow-x: auto;
            margin: 4px 0;
        }
        code {
            font-family: Menlo, Monaco, "Courier New", monospace;
            font-size: 12px;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 1px 3px;
            border-radius: 3px;
        }
        pre code { background-color: transparent; padding: 0; }
        ul, ol { margin-left: 16px; margin-bottom: 4px; }
        li { margin-bottom: 2px; }
        blockquote {
            border-left: 3px solid rgba(0, 0, 0, 0.2);
            padding-left: 6px;
            margin: 4px 0;
            color: rgba(0, 0, 0, 0.75);
        }
        hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.14);
            margin: 9px 0;
        }
        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            margin: 6px 0;
            font-size: 12.5px;
            border: 1px solid rgba(0, 0, 0, 0.14);
            border-radius: 7px;
            overflow: hidden;
        }
        th, td {
            border-right: 1px solid rgba(0, 0, 0, 0.10);
            border-bottom: 1px solid rgba(0, 0, 0, 0.10);
            padding: 6px 8px;
            text-align: center;
            vertical-align: middle;
        }
        th:last-child, td:last-child { border-right: none; }
        tr:last-child td { border-bottom: none; }
        th {
            background-color: rgba(0, 0, 0, 0.05);
            font-weight: 600;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.85);
        }
        td { background-color: rgba(255, 255, 255, 0.45); }

        /* 다크 모드. 앱 전체 외형을 바꾸면 웹뷰도 이 규칙을 따릅니다.
           수식은 KaTeX가 그린 노드라 색을 물려받게 두어야 합니다. */
        @media (prefers-color-scheme: dark) {
            body { color: #ECECEC; }
            .katex, .katex * { color: inherit; }
            code, pre { background-color: rgba(255, 255, 255, 0.10); }
            blockquote { color: rgba(255, 255, 255, 0.72); }
            table { border-color: rgba(255, 255, 255, 0.18); }
            th, td { border-color: rgba(255, 255, 255, 0.12); }
            th { background-color: rgba(255, 255, 255, 0.10); color: rgba(255, 255, 255, 0.92); }
            td { background-color: rgba(255, 255, 255, 0.04); }
            hr { border-color: rgba(255, 255, 255, 0.16); }
            a { color: #6FB3FF; }
        }
    </style>
</head>
<body>
    <div id="content"></div>
    <script>
        const container = document.getElementById('content');
        const md = window.markdownit({ html: false, breaks: true, linkify: true });

        // markdown-it의 줄바꿈 처리가 $$ ... $$ 내부에 <br>를 넣으면
        // KaTeX가 시작/끝 구분자를 한 블록으로 찾지 못합니다. 먼저 블록 수식을
        // 안전한 토큰으로 치환하고 Markdown 렌더링 뒤 KaTeX HTML로 복원합니다.
        function protectDisplayMath(source, left, right, sink) {
            let output = '';
            let cursor = 0;
            while (cursor < source.length) {
                const start = source.indexOf(left, cursor);
                if (start < 0) { output += source.slice(cursor); break; }
                const end = source.indexOf(right, start + left.length);
                if (end < 0) { output += source.slice(cursor); break; }
                const token = `KATEXDISPLAYBLOCKTOKEN${sink.length}END`;
                sink.push(source.slice(start + left.length, end));
                output += source.slice(cursor, start) + String.fromCharCode(10, 10) + token + String.fromCharCode(10, 10);
                cursor = end + right.length;
            }
            return output;
        }

        // CommonMark는 닫는 **가 구두점 뒤에 오고 곧바로 글자가 이어지면 강조를 닫지 않습니다.
        // 한국어는 "**공식(확장)**을"처럼 괄호·마침표 뒤에 조사가 바로 붙어 이 규칙에 자주 걸립니다.
        // 강조 안쪽 끝에 폭 없는 공백을 넣어 구두점 판정만 피하고 보이는 글자는 바꾸지 않습니다.
        function fixTightBoldDelimiters(source) {
            if (source.indexOf('```') >= 0) return source; // 코드 블록은 건드리지 않습니다
            return source.replace(/\*\*(\S(?:[\s\S]*?\S)?)\*\*/g, (match, inner, offset, whole) => {
                const following = whole[offset + match.length];
                const lastChar = inner[inner.length - 1];
                const endsWithPunctuation = /[\p{P}\p{S}]/u.test(lastChar);
                const followedByLetter = following !== undefined && /[\p{L}\p{N}]/u.test(following);
                return (endsWithPunctuation && followedByLetter)
                    ? '**' + inner + String.fromCharCode(0x200B) + '**'
                    : match;
            });
        }

        // 가로로 길게 이어진 등호(=) 전개식을 자동으로 \begin{aligned} 세로 정렬로 변환합니다.
        function autoAlignLongMath(formula) {
            const trimmed = formula.trim();
            if (trimmed.includes('\\\\') || trimmed.includes('\\begin{') || trimmed.includes('\\cases') || trimmed.includes('\\matrix')) {
                return trimmed;
            }
            let parts = [];
            let current = '';
            let depth = 0;
            for (let i = 0; i < trimmed.length; i++) {
                const c = trimmed[i];
                if (c === '{' || c === '(' || c === '[') depth++;
                else if (c === '}' || c === ')' || c === ']') depth = Math.max(0, depth - 1);
                
                if (depth === 0) {
                    let op = null;
                    let skip = 0;
                    if (c === '=' && !trimmed.startsWith('==', i)) {
                        op = '='; skip = 1;
                    } else if (trimmed.startsWith('\\approx', i) && !/[a-zA-Z]/.test(trimmed[i + 7] || '')) {
                        op = '\\approx'; skip = 7;
                    } else if (trimmed.startsWith('\\equiv', i) && !/[a-zA-Z]/.test(trimmed[i + 6] || '')) {
                        op = '\\equiv'; skip = 6;
                    } else if (trimmed.startsWith('\\le', i) && !/[a-zA-Z]/.test(trimmed[i + 3] || '')) {
                        op = '\\le'; skip = 3;
                    } else if (trimmed.startsWith('\\ge', i) && !/[a-zA-Z]/.test(trimmed[i + 3] || '')) {
                        op = '\\ge'; skip = 3;
                    }
                    if (op) {
                        parts.push({ expr: current.trim(), op: op });
                        current = '';
                        i += (skip - 1);
                        continue;
                    }
                }
                current += c;
            }
            if (current.trim()) {
                parts.push({ expr: current.trim(), op: '' });
            }
            if (parts.length >= 3 || (parts.length >= 2 && trimmed.length > 48)) {
                let aligned = '\\begin{aligned}\n';
                for (let idx = 0; idx < parts.length; idx++) {
                    if (idx === 0) {
                        aligned += parts[0].expr + ' &' + parts[0].op + ' ';
                    } else if (idx < parts.length - 1) {
                        aligned += parts[idx].expr + ' \\\\\n&' + parts[idx].op + ' ';
                    } else {
                        aligned += parts[idx].expr + '\n';
                    }
                }
                aligned += '\\end{aligned}';
                return aligned;
            }
            return trimmed;
        }

        // 긴 수식이 말풍선 폭을 넘으면 글자 크기를 줄여 통째로 보이게 맞춥니다.
        function fitDisplayMath() {
            const blocks = container.querySelectorAll('.katex-display');
            for (const block of blocks) {
                const formula = block.querySelector('.katex');
                if (!formula) continue;
                formula.style.removeProperty('font-size');
                block.classList.remove('is-overflowing');
                const available = block.clientWidth;
                if (available <= 0) continue;
                for (let pass = 0; pass < 2; pass++) {
                    const needed = formula.scrollWidth;
                    if (needed <= available) break;
                    const current = parseFloat(getComputedStyle(formula).fontSize);
                    const target = Math.max(current * (available / needed) * 0.98, 12);
                    formula.style.setProperty('font-size', target + 'px', 'important');
                }
                if (formula.scrollWidth > block.clientWidth + 1) {
                    block.classList.add('is-overflowing');
                }
            }
        }

        function sendHeight() {
            const height = Math.ceil(container.scrollHeight);
            if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.heightHandler) {
                window.webkit.messageHandlers.heightHandler.postMessage(height);
            }
        }

        function refresh() {
            fitDisplayMath();
            sendHeight();
        }

        // 검색어 하이라이트
        window.highlightSearch = function (needle, isCurrent) {
            document.querySelectorAll('mark.kk-find').forEach(function (m) {
                m.replaceWith(document.createTextNode(m.textContent));
            });
            document.body.normalize();
            if (!needle) return;

            var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
                acceptNode: function (node) {
                    if (node.parentElement.closest('.katex, .katex-display, script, style')) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return node.nodeValue.toLowerCase().indexOf(needle.toLowerCase()) >= 0
                        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                }
            });
            var targets = [];
            while (walker.nextNode()) targets.push(walker.currentNode);

            var color = isCurrent ? '#59a8ff' : '#a8d9ff';
            targets.forEach(function (node) {
                var text = node.nodeValue;
                var lower = text.toLowerCase();
                var find = needle.toLowerCase();
                var frag = document.createDocumentFragment();
                var at = 0, hit;
                while ((hit = lower.indexOf(find, at)) >= 0) {
                    if (hit > at) frag.appendChild(document.createTextNode(text.slice(at, hit)));
                    var mark = document.createElement('mark');
                    mark.className = 'kk-find';
                    mark.style.background = color;
                    mark.style.color = 'inherit';
                    mark.style.borderRadius = '2px';
                    mark.textContent = text.slice(hit, hit + needle.length);
                    frag.appendChild(mark);
                    at = hit + needle.length;
                }
                if (at < text.length) frag.appendChild(document.createTextNode(text.slice(at)));
                node.parentNode.replaceChild(frag, node);
            });
        };

        window.renderContent = function (rawMarkdown) {
            const displayMathBlocks = [];
            let source = protectDisplayMath(rawMarkdown, '$$', '$$', displayMathBlocks);
            source = protectDisplayMath(source, '\\[', '\\]', displayMathBlocks);
            source = fixTightBoldDelimiters(source);

            let renderedHtml = md.render(source);
            displayMathBlocks.forEach((formula, index) => {
                const token = `KATEXDISPLAYBLOCKTOKEN${index}END`;
                const formatted = autoAlignLongMath(formula);
                const mathHtml = katex.renderToString(formatted.trim(), {
                    displayMode: true, throwOnError: false, strict: false
                });
                renderedHtml = renderedHtml.split(token).join(mathHtml);
            });
            container.innerHTML = renderedHtml;

            renderMathInElement(container, {
                delimiters: [
                    { left: '$$', right: '$$', display: true },
                    { left: '$', right: '$', display: false },
                    { left: '\\(', right: '\\)', display: false },
                    { left: '\\[', right: '\\]', display: true }
                ],
                throwOnError: false,
                strict: false
            });

            refresh();
            setTimeout(refresh, 40);
            return Math.ceil(container.scrollHeight);
        };

        const resizeObserver = new ResizeObserver(() => { sendHeight(); });
        resizeObserver.observe(container);

        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.readyHandler) {
            window.webkit.messageHandlers.readyHandler.postMessage(1);
        }
    </script>
</body>
</html>
